<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">

    <title>聖媽廟 360° 全景</title>

    <link rel="stylesheet"
          href="./pannellum/pannellum.css">

    <script src="./pannellum/pannellum.js"></script>

    <style>
        html, body{
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #panorama {
            width: 100%;
            height: 100vh;
        } 

    </style>
</head>

<body>

<div id="panorama"></div>

<script>

pannellum.viewer('panorama', {
    "default": {
        "firstScene": "scene1",
        "autoLoad": true,
        "author": "Yen-Yu Chen"
    },

    "scenes":{
        "scene1": {
            "type": "equirectangular",
            "panorama": "./photo/20260812_1149_shengma_01.JPG",
            "title": "聖媽廟外觀",
            "pitch": -5,
            "yaw": 180,
            "hfov": 100,
            "compass": true,
            "northOffset": 0,
            "hotSpots": [
                {
                    "pitch": -20,
                    "yaw": -178,
                    "type": "info",
                    "text": `
                        <div style="text-align: center;">
                            <img src="./photo/20260807_shengmaxianglu.jpg" style="width: 180px; height: auto;"/><br/>
                            <strong>香爐</strong><br/>
                            香爐上刻著「Ｘ王堂」（第一個字辨識不清）的字樣
                        </div>
                    `
                }
            ]
        }
    }
});


</script>

</body>
</html>
